breadth_health:              # เกณฑ์สีใน Playbook
  green_min: 50
  yellow_min: 30

user_holdings:               # ธีมที่ผู้ใช้ถือ (ใส่ป้าย 📍)
  - semiconductors

fetch:
  retries: 3
  retry_wait_sec: 5
